[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptonik"
version = "1.1.0"
description = "A local, cross-platform cryptography and security toolkit."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Cryptonik contributors" }]
dependencies = [
    "argon2-cffi>=23.1,<26",
    "cryptography>=46,<51",
    "PyNaCl>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
cryptonik = "cryptosuite.main:main"
cryptosuite = "cryptosuite.main:main"

[tool.setuptools.packages.find]
include = ["cryptonik*", "cryptosuite*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
